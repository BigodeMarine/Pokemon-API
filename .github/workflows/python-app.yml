name: CI - Pokemon API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  test:

    runs-on: ubuntu-latest

    env:
      APP_NAME: Pokemon API
      APP_VERSION: "1.0.0"
      APP_DESCRIPTION: API de Pokémons utilizando FastAPI e PokeAPI
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: "8000"

      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pokemon_db

      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_DB: "0"

    services:

      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: pokemon_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d pokemon_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:

      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar migrations
        run: |
          alembic upgrade head

      - name: Executar testes
        run: |
          pytest -vv

      - name: Gerar cobertura
        run: |
          pytest --cov=app --cov-report=term-missing

      - name: Configurar Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Login no GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}